<style>
/* Layout: one phone-width column. Welcome (3 steps), Home with search, an entry laid out as in the book,
   a bottom sheet for the tapped Arabic word, Saved, Profile. Tab bar fixed to the bottom of the column. */
:root {
  --bg: #f4f2ec; --surface: #ffffff; --ink: #161c2e; --muted: #565c6e; --line: #e2ddd0;
  --accent: #1b2340; --accent-ink: #ecd27c; --accent-soft: #e6e7ee; --accent-deep: #121830; --dot: #c9c4b4;
  --warn: #8a5a00; --warn-soft: #fbefd2; --gold: #a07812;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-ar: "Noto Naskh Arabic", "Geeza Pro", "Traditional Arabic", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10152a; --surface: #1a2140; --ink: #ece6d6; --muted: #a4a6b4; --line: #2a3254;
  --accent: #d9b44a; --accent-ink: #141a33; --accent-soft: #262d4d; --accent-deep: #f0d58a; --dot: #3a4266;
  --warn: #f0c36a; --warn-soft: #33290f; --gold: #e6c35c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10152a; --surface: #1a2140; --ink: #ece6d6; --muted: #a4a6b4; --line: #2a3254;
  --accent: #d9b44a; --accent-ink: #141a33; --accent-soft: #262d4d; --accent-deep: #f0d58a; --dot: #3a4266;
  --warn: #f0c36a; --warn-soft: #33290f; --gold: #e6c35c; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 104px; }
#app.bare { padding-bottom: 24px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { text-decoration: none; }
.top { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 6px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand .ar { font-family: 'Amiri', var(--font-ar); font-weight: 700; font-size: 38px; line-height: 1.1; color: var(--accent); }
.brand b { font-size: 20px; font-weight: 600; letter-spacing: 0.02em; }
.round { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); }
.search { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; background: color-mix(in srgb, var(--accent-soft) 84%, var(--ink)); border: 1px solid color-mix(in srgb, var(--dot) 75%, var(--ink)); border-radius: 14px; margin: 8px 0 16px; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 17px; }
.search:focus-within { border-color: var(--accent); background: var(--surface); }
.search input::placeholder { color: var(--muted); }
.lbl { font-size: 12px; letter-spacing: 0.08em; font-weight: 600; color: var(--muted); text-transform: uppercase; margin: 18px 0 8px; }
.wotd { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 12px; width: 100%; text-align: left; background: var(--accent-soft); border: 0; border-radius: 14px; padding: 10px 14px; font-size: 14px; }
.wotd > span:last-child { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
.wotd .k { font-size: 11px; letter-spacing: 0.08em; font-weight: 600; color: var(--accent-deep); }
.wotd .w { font-family: var(--font-ar); font-size: calc(26px * var(--ars, 1)); line-height: 1.5; direction: rtl; color: var(--accent); grid-column: 2; grid-row: 1 / span 2; }
.more { margin-top: 14px; } .more > summary { cursor: pointer; color: var(--muted, #888); font-size: 14px; padding: 10px 2px; list-style: none; } .more > summary::before { content: '▸ '; } .more[open] > summary::before { content: '▾ '; } .more > .list { margin-top: 8px; }
.letters { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; direction: rtl; }
.letter { width: 100%; aspect-ratio: 1; min-height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-family: var(--font-ar); font-size: 22px; color: var(--gold); }
.quad { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.quad .geo { color: var(--gold); font-family: "Comfortaa", var(--font-ui); font-weight: 700; font-size: 13px; margin-top: 0; height: auto; min-height: 56px; padding: 8px 10px; text-align: center; }
.geo { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; margin-top: 10px; height: 46px; padding: 0 10px; line-height: 1.15; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13.5px; }
.geo:hover { border-color: var(--accent); } .geo .fl { font-size: 17px; letter-spacing: 2px; }
.letter.on { background: var(--accent-soft); border-color: var(--accent); color: var(--gold); }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 10px 16px; min-height: 52px; width: 100%; text-align: left; background: none; border: 0; }
.row + .row { border-top: 1px solid var(--line); }
button.row:hover { background: var(--bg); }
.row .g { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.row .r { font-family: var(--font-ar); font-size: calc(26px * var(--ars, 1)); line-height: 1.5; direction: rtl; color: var(--accent); }
.row .s { font-size: 15px; color: var(--muted); }
.empty { padding: 20px 4px; color: var(--muted); }
.count { font-size: 13px; color: var(--muted); margin: 10px 0 8px; }
.list { display: grid; gap: 10px; }
.card { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; align-items: center; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.card:hover { border-color: var(--accent); }
.card .root { font-family: var(--font-ar); font-size: calc(30px * var(--ars, 1)); line-height: 1.5; direction: rtl; grid-column: 2; grid-row: 1 / span 2; color: var(--accent); }
.card .gloss { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card .meta { font-size: 13px; color: var(--muted); }
.bar[hidden] { display: none; }
.nbar { position: sticky; top: 0; z-index: 6; background: var(--bg); padding: calc(8px + env(safe-area-inset-top, 0px)) 0 8px; }
.navg { display: flex; gap: 8px; }
.navb { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); color: var(--accent); font: 600 14px/1 var(--font-ui); cursor: pointer; }
.navb svg { width: 18px; height: 18px; }
.bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 0; }
.link { background: none; border: 0; color: var(--accent); padding: 8px 0; min-height: 44px; font-weight: 500; }
.mark { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); }
.mark[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.entry-head { display: flex; align-items: center; gap: 14px; margin: 2px 0; }
.entry-head .root { font-family: var(--font-ar); font-size: calc(44px * var(--ars, 1)); line-height: 1.4; direction: rtl; color: var(--accent); }
.entry-head .src { font-size: 13px; color: var(--muted); }
.book { margin: 0; padding: 10px 0; border-top: 1px solid var(--line); font-size: 17px; line-height: 2.2; }
.book.sub { padding-left: 18px; }
.arr { unicode-bidi: isolate; font-family: var(--font-ar); font-size: calc(27px * var(--ars, 1)); line-height: 1.4; }
.aw { font: inherit; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 1px 0 var(--line); color: var(--ink); padding: 0 8px; margin: 1px 2px; border-radius: 9px; cursor: pointer; }
.aw:hover, .aw.on { background: var(--accent-soft); border-color: var(--accent); }
.aw:active { transform: translateY(1px); box-shadow: none; }
.badge { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); margin-left: 6px; vertical-align: middle; }
.cont { margin-top: 14px; font-size: 13px; color: var(--muted); font-style: italic; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--surface); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0;
  box-shadow: 0 -8px 30px rgba(0,0,0,0.16); max-height: 62vh; overflow-y: auto;
  padding: 14px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet .in { max-width: 480px; margin: 0 auto; }
.tsr-box { margin: 12px 0; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.tsr-box > summary { cursor: pointer; font-weight: 600; color: var(--accent); padding: 4px 0; }
.tsr-note { font-size: 12px; color: var(--muted); margin: 6px 0; }
.tsr-box.test { border-color: var(--warn); background: var(--warn-soft); }
.tsr-box.test > summary { color: var(--warn); }
.segs { display: flex; gap: 6px; margin: 8px 0; }
.seg { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 14px; font-size: 13px; }
.seg.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.arw { font-family: var(--font-ar); font-size: 17px; }
.tsr td .uz { display: block; font-family: var(--font-ui); font-size: 11px; color: var(--muted); white-space: normal; line-height: 1.25; margin-top: 2px; }
.drv .uzl { font-size: 13px; color: var(--muted); font-weight: 400; }
.fm.hl { background: var(--warn-soft); box-shadow: 0 0 0 3px var(--warn-soft); border-radius: 4px; transition: background .6s; }
.cmp { display: grid; gap: 6px; margin: 6px 0 10px; font-size: 14px; }
.cmp .r { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.cmp .r .arw { font-size: 22px; }
.drv { border-top: 1px dashed var(--line); padding: 8px 0 2px; }
.drv-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-weight: 600; font-size: 14px; }
.drv-h .arw { font-size: 22px; font-weight: 400; }
ol.bm { padding-left: 20px; font-size: 14px; margin: 6px 0; }
ol.bm li { margin: 4px 0; }
.testbadge { font-size: 11px; font-weight: 700; color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 6px; padding: 1px 6px; margin-left: 6px; }
.tsr-box h4 { margin: 12px 0 6px; font-size: 13px; }
.tsr-wrap { overflow-x: auto; }
.tsr { border-collapse: collapse; width: 100%; font-size: 11px; }
.tsr th, .tsr td { border: 1px solid var(--line); padding: 4px 5px; text-align: center; font-weight: 500; }
.tsr td { font-family: var(--font-ar); font-size: calc(19px * var(--ars, 1)); line-height: 1.6; white-space: nowrap; }
.tsr thead th { color: var(--muted); }
.sheet .head { display: flex; align-items: center; gap: 10px; }
.sheet .head .w { font-family: var(--font-ar); font-size: calc(38px * var(--ars, 1)); line-height: 1.5; direction: rtl; color: var(--accent); }
.sheet .head .f { font-size: 13px; color: var(--muted); }
.sheet .close { margin-left: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; min-height: 36px; }
.kv { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 6px 0 10px; font-size: 14px; color: var(--muted); }
.kv b { color: var(--ink); font-weight: 500; }
ol.mean { margin: 6px 0 10px; padding-left: 22px; }
ol.mean li { margin: 3px 0; }
.sheet h3 { margin: 12px 0 6px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.exs { display: grid; gap: 8px; }
.ex { display: grid; gap: 2px; padding: 8px 10px; background: var(--bg); border-radius: 8px; }
.ex .p { text-align: right; }
.rels { display: grid; gap: 6px; }
.rel { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; min-height: 48px; }
.rel:hover { border-color: var(--accent); }
.rel .l { color: var(--muted); font-size: 13px; font-weight: 600; }
.rel .g { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 15px; }
.rel .w { font-family: var(--font-ar); font-size: calc(26px * var(--ars, 1)); line-height: 1.5; direction: rtl; color: var(--accent); }
.warn { margin-top: 12px; padding: 8px 10px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: 13px; }
#tabs { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 480px; z-index: 30; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
#tabs a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 64px; color: var(--muted); font-size: 12px; }
#tabs a.on { color: var(--accent); font-weight: 600; }
/* fbbar */
.fbbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(64px + env(safe-area-inset-bottom, 0px) + 10px); width: auto; max-width: calc(100% - 32px); white-space: nowrap; z-index: 29; display: flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 19px; border: 1px solid var(--gold); background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 600; box-shadow: 0 3px 12px rgba(0,0,0,0.08); }
.bar:not([hidden]) ~ .fbbar, .bar:not([hidden]) ~ .fbsp { display: none; }   /* фақат бўш бош экранда */
.fbbar .dotg { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); flex: none; }
.fbbar .sub { color: var(--muted); font-weight: 500; }
.fbsp { height: 56px; }
.fbov { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.45); display: flex; align-items: flex-end; justify-content: center; }

/* stone */ .fbcard .fbsalam { font-family: 'KanzSalam', var(--font-ar); font-size: 27px; line-height: 2.1; direction: rtl; text-align: center; margin: 0 0 8px; }
.fbcard .fbsalam span { background: linear-gradient(180deg, #7a5200 0%, #b8860b 38%, #e6c35c 62%, #9a6c05 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 1px 0 rgba(255,255,255,0.9)) drop-shadow(0 -1px 0.5px rgba(60,40,0,0.6)) drop-shadow(0 2px 2px rgba(120,90,20,0.18)); }
:root[data-theme="dark"] .fbcard .fbsalam span { background: linear-gradient(180deg, #a87c12 0%, #e2bd55 45%, #f4dd8a 62%, #b98d1c 100%); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 1px 0 rgba(255,255,255,0.18)) drop-shadow(0 -1px 0.5px rgba(0,0,0,0.9)); }
.fbcard h2 { margin: 0 0 10px; font-size: 19px; }
.fbcard p { margin: 0 0 12px; line-height: 1.5; font-size: 15px; }
.fbcard textarea { width: 100%; box-sizing: border-box; min-height: 130px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 16px; resize: vertical; }
.fbcard .row { display: flex; gap: 10px; margin-top: 12px; }
.fbcard .send { flex: 1; min-height: 48px; border-radius: 12px; border: 0; background: var(--accent); color: var(--surface); font-size: 16px; font-weight: 600; }
.fbcard .send[disabled] { opacity: .5; }
.fbcard .cls { min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: 15px; }
.fbcard .msg { margin-top: 10px; font-size: 14px; color: var(--muted); min-height: 20px; }
.tab-ar { font-family: var(--font-ar); font-size: 17px; line-height: 22px; height: 22px; direction: rtl; white-space: nowrap; }
.alif-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; direction: rtl; }
.alif-b { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 72px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink, inherit); }
.alif-b:hover { border-color: var(--accent); }
.alif-l { font-family: var(--font-ar); font-size: 30px; line-height: 1.3; color: var(--gold); }
.alif-n { font-size: 11px; color: var(--muted); direction: ltr; }
#tabs a { font-size: 11px; }
.bk-sub { color: var(--muted); font-size: 14px; margin: -2px 0 12px; }
.lessons { display: grid; gap: 8px; }
.lesson { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.lesson:hover { border-color: var(--accent); }
.rule { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.rule .rn { font-weight: 700; color: var(--accent); min-width: 1.6em; }
.rule p { margin: 0; line-height: 1.75; }
.rule .arr { font-size: calc(22px * var(--ars, 1)); }
.abrow { display: grid; grid-template-columns: minmax(84px, 34%) 1fr; gap: 12px; padding: 10px 16px; align-items: baseline; }
.abrow + .abrow, .lrow + .lrow { border-top: 1px solid var(--line); }
.abrow .ab { font-weight: 600; color: var(--accent); overflow-wrap: anywhere; }
.lrow { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 8px 16px; min-height: 52px; }
.lrow .u { flex: 1 1 0; min-width: 0; overflow-wrap: anywhere; } .lrow .u small { display: block; color: var(--muted); font-size: 12px; }
.lrow .a { font-family: var(--font-ar); font-size: calc(24px * var(--ars, 1)); line-height: 1.5; direction: rtl; text-align: right; color: var(--accent); flex: 0 1 auto; max-width: 62%; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; min-height: 84px; padding: 8px 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.tile:hover { border-color: var(--accent); }
.tile .n { font-weight: 700; color: var(--accent); font-size: 15px; line-height: 1.1; }
.tile .t { font-size: 12px; line-height: 1.2; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.lesson .n { grid-row: 1 / span 2; font-weight: 700; color: var(--accent); min-width: 44px; font-size: 14px; }
.lesson .t { font-weight: 600; }
.lesson .s { color: var(--muted); font-size: 13px; }
.pages { display: grid; gap: 10px; margin-top: 10px; }
.pages figure { margin: 0; background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.pages img { display: block; width: 100%; height: auto; }
.pages figcaption { font-size: 12px; color: var(--muted); padding: 4px 8px; background: var(--surface); }
.lnav { display: flex; justify-content: space-between; gap: 10px; margin: 14px 0; }
#tabs svg { stroke: currentColor; }
.hero { background: var(--accent); border-radius: 28px; padding: 28px 24px 12px; display: flex; flex-direction: column; justify-content: space-between; min-height: 300px; margin-top: 12px; }
.hero.cover { padding: 0; min-height: 0; background: #1b2340; overflow: hidden; display: block; }
.hero.cover img { width: 100%; height: auto; display: block; }
.hist .lbl { display: flex; justify-content: space-between; align-items: center; }
.hist .hclr { font-size: 13px; padding: 0; min-height: 32px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 16px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px; color: var(--ink); }
.brand { align-items: center; gap: 8px; }
.acts { display: flex; align-items: center; gap: 13px; padding-bottom: 15px; }
.acts .round[data-l]::after { content: attr(data-l); position: absolute; top: 47px; left: 50%; transform: translateX(-50%); font-size: 9.5px; line-height: 1; font-weight: 500; letter-spacing: .01em; color: var(--muted); white-space: nowrap; font-family: var(--font-ui); }
.round { position: relative; color: var(--accent); cursor: pointer; }
.round.star { color: var(--gold); }
.round .cnt { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--gold); color: var(--surface); font-size: 11px; font-weight: 600; line-height: 18px; text-align: center; }

let tq = '';

    }

      const q0 = normUz(isLat(t) ? latCyr(t) : t).replace(/[^a-zа-я ]+/g, ' ').trim(); const P = (x) => { try { const ps = uzParts(x.f); return ps.length && normUz(ps[0].p) === q0 ? 0 : 1; } catch (z) { return 1; } };
      hits.sort((a, b) => P(a) - P(b) || R(a) - R(b) || a.e.derivatives.indexOf(a.f) - b.e.derivatives.indexOf(b.f)); }
