<style>
/* Layout: one phone-width column. Welcome (3 steps), Home with search, an entry laid out as in the book,
   a bottom sheet for the tapped Arabic word, Saved, Profile. Tab bar fixed to the bottom of the column. */
:root {
  --bg: #f4f2ec; --surface: #ffffff; --ink: #161c2e; --muted: #565c6e; --line: #e2ddd0;
  --accent: #1b2340; --accent-ink: #ecd27c; --accent-soft: #e6e7ee; --accent-deep: #121830; --dot: #c9c4b4;
  --warn: #8a5a00; --warn-soft: #fbefd2; --gold: #a07812;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-ar: "Noto Naskh Arabic", "Geeza Pro", "Traditional Arabic", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10152a; --surface: #1a2140; --ink: #ece6d6; --muted: #a4a6b4; --line: #2a3254;
  --accent: #d9b44a; --accent-ink: #141a33; --accent-soft: #262d4d; --accent-deep: #f0d58a; --dot: #3a4266;
  --warn: #f0c36a; --warn-soft: #33290f; --gold: #e6c35c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10152a; --surface: #1a2140; --ink: #ece6d6; --muted: #a4a6b4; --line: #2a3254;
  --accent: #d9b44a; --accent-ink: #141a33; --accent-soft: #262d4d; --accent-deep: #f0d58a; --dot: #3a4266;
  --warn: #f0c36a; --warn-soft: #33290f; --gold: #e6c35c; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 104px; }

.wotd { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 12px; width: 100%; text-align: left; background: var(--accent-soft); border: 0; border-radius: 14px; padding: 10px 14px; font-size: 14px; }

const DATA = window.ANNAIM_DATA || [];

const KEY = 'kanz-test-v1';

function lessonPages(b, i) {
  if (b.lessons[i][3]) return b.lessons[i][3];
  const L = b.lessons, s = L[i][2], nx = L[i + 1] ? L[i + 1][2] : b.total + 1;
  const end = (L[i + 1] && !b.topStart.includes(nx)) ? nx : nx - 1;
  const out = []; for (let p = s; p <= Math.max(s, end); p++) out.push(p); return out;
}

}

// ---------- маршрут ----------
function route() {
  const hsh = location.hash.replace(/^#/, '');
  if (!S.seen && !/^w[1234]$/.test(hsh)) return go('w1');
  if (/^w[1234]$/.test(hsh)) return welcome(+hsh[1]);
  const m = hsh.match(/^e-(.+)$/); const e = m && DATA.find(x => hashOf(x) === 'e-' + m[1]);
  if (e) return renderEntry(e);
  const gm = hsh.match(/^(guide|extra)-(\d+)$/);
  if (gm) { const i = +gm[2]; return gm[1] === 'guide' ? (i === 0 ? renderRules() : renderAbbr()) : renderExtra(i); }
  const bm = hsh.match(/^(sarf|nahv|guide|extra)(?:-(\d+))?$/); if (bm) return bm[2] === undefined ? renderBook(bm[1]) : renderLesson(bm[1], +bm[2]);
  if (hsh === 'saved') return renderSaved();
  if (hsh === 'geo') return renderGeo();
  if (hsh === 'profile') return renderProfile();
  query = hsh === 'home' ? query : ''; return renderHome();
}
